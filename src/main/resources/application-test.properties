spring.datasource.url=jdbc:sqlserver://${DB_SERVER:sqlserver}:${DB_PORT:1433};databaseName=${DB_NAME:dormly_test};encrypt=false;trustServerCertificate=true;sendTimeAsDateTime=false
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}

app.redis.host=${REDIS_HOST:redis}
app.redis.port=${REDIS_PORT:6379}
app.redis.username=${REDIS_USERNAME:}
app.redis.password=${REDIS_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

notification.twilio.account-sid=${TWILIO_SID:test}
notification.twilio.auth-token=${TWILIO_TOKEN:test}
notification.twilio.from-number=${TWILIO_FROM:test}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
