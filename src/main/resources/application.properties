spring.application.name=DormlyBackend

server.port=8080

spring.datasource.url=jdbc:sqlserver://${DB_SERVER:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:dormly_test};encrypt=true;trustServerCertificate=true;sendTimeAsDateTime=false
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Admin@123}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===== Tracing sampling =====
management.tracing.sampling.probability=1.0

# ===== Zipkin endpoint =====
#management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ===== Logging pattern =====
logging.pattern.console=%d{HH:mm:ss} [%X{traceId}] [%X{spanId}] %-5level %logger{36} - %msg%n

app.jwt.secret=b7f3c2d91a4e8f6b5c7d2e1f9a0b3c4d8e6f1a2b5c7d9e0f3a1b4c6d8e9f0a2
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

#spring.security.require-ssl=true

# Fix invalid path pattern errors with swagger-ui assets on Spring Boot 3.5
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Temporarily disable swagger-ui to avoid invalid mapping pattern on Spring Boot 3.5
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.persist-authorization= true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9095}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.DormlyBackend.dto.notification
spring.kafka.consumer.properties.spring.json.type.mapping=notificationEvent:com.example.DormlyBackend.dto.notification.NotificationEvent
spring.kafka.consumer.properties.max.poll.records=10
spring.kafka.consumer.properties.max.poll.interval.ms=300000


# Listener
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.concurrency=3


notification.twilio.account-sid=${TWILIO_SID:test}
notification.twilio.auth-token=${TWILIO_TOKEN:test}
notification.twilio.from-number=${TWILIO_FROM:test}

notification.firebase.credentials-path=classpath:firebase-service-account.json

notification.retry.max-attempts=3
notification.retry.backoff-ms=1000

notification.scheduler.reminder-cron=0 0 8 * * *
notification.scheduler.retry-failed-cron=0 */30 * * * *

# Mail Server
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dormlybuilding@gmail.com
spring.mail.password=""

# Mail Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-client-secret}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile
#spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.auth-code-expiry-ms=300000
app.frontend-url=http://localhost:5500

#spring.flyway.create-database-schemas=true

app.upload.dir=uploads/user-documents

spring.flyway.create-database-schemas=true

ticket.scheduler.overdue-cron=0 0 8 * * *
ticket.scheduler.overdue-reminder-days=3

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
